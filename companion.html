<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companion</title>
<style>
  :root{
    --teal:#115E72; --ink:#1c2733; --slate:#5b6b78; --line:#d8dee3;
    --bg:#e6eaf0; --card:#fff; --link:#1d5fbf; --user:#fbfcfd;
    --sans:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);display:flex;justify-content:center}
  .app{width:100%;max-width:520px;height:100vh;background:var(--card);
    display:flex;flex-direction:column;box-shadow:0 0 24px rgba(0,0,0,.12)}
  .titlebar{background:#f6e7b8;font-size:13px;padding:5px 10px;color:#3a3a3a}
  .titlebar b{font-weight:600}
  header{background:var(--teal);color:#fff;padding:18px 22px}
  header h1{margin:0;font-size:22px;font-weight:700}
  .stream{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
  .greet{border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  .greet h2{font-size:18px;margin:0 0 8px;font-weight:600}
  .greet p{margin:0 0 14px;color:#33414d;font-size:14.5px}
  .info-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);
    background:#fff;border-radius:6px;padding:8px 14px;font-size:14px;color:var(--ink);cursor:pointer}
  .info-btn:hover{border-color:var(--teal)}
  .row{display:flex;flex-direction:column}
  .row.user{align-items:flex-end}
  .bubble-user{border:1px solid var(--line);border-radius:8px;padding:10px 14px;
    max-width:80%;font-size:15px;background:var(--user)}
  .stamp{font-size:11.5px;color:#9aa6b0;margin-top:4px}
  .answer{border:1px dashed #c3ccd4;border-radius:8px;padding:16px 18px;font-size:14.5px;line-height:1.55}
  .answer .srchdr{font-weight:700;margin-bottom:8px}
  .answer p{margin:0 0 8px}
  .answer ol,.answer ul{margin:6px 0 10px;padding-left:22px}
  .answer li{margin:5px 0}
  .cite{display:inline-flex;align-items:center;gap:2px;color:var(--link);text-decoration:none;
    font-size:12.5px;white-space:nowrap;margin:0 1px}
  .cite:hover{text-decoration:underline}
  .cite svg{width:10px;height:10px}
  .caret{color:#b5c0c9}
  .refs-toggle{margin-top:8px;background:none;border:none;color:var(--slate);font-size:13px;
    cursor:pointer;padding:4px 0}
  .refs{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .ref{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
  .ref .num{flex:0 0 auto;width:20px;height:20px;border:1px solid var(--line);border-radius:4px;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--slate)}
  .ref a{color:var(--link);text-decoration:none;font-size:14px;display:inline-flex;align-items:center;gap:5px}
  .ref a:hover{text-decoration:underline}
  .ref a svg{width:13px;height:13px;flex:0 0 auto}
  .ref .pg{color:var(--slate);font-size:12.5px}
  .typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#b5c0c9;
    margin-right:5px;animation:blink 1.2s infinite both}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.typing span{animation:none;opacity:.6}}
  .composer{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
  .composer input{flex:1;border:none;outline:none;font-size:15px;font-family:var(--sans);
    padding:8px 4px;color:var(--ink);background:transparent}
  .composer button{background:none;border:none;cursor:pointer;color:var(--teal);padding:6px;border-radius:6px}
  .composer button:hover{background:#eef4f6}
  .composer button:disabled{color:#c2ccd3;cursor:default;background:none}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar"><b>Companion</b></div>
  <header><h1>Companion</h1></header>
  <div class="stream" id="stream">
    <div class="greet">
      <h2>👋 Hello, I'm Companion, a virtual assistant.</h2>
      <p>I answer your questions from the manual and may make mistakes.</p>
      <button class="info-btn" onclick="ask('How do I get the analysis results report?')">
        ⚖️ Try: How do I get the analysis results report?</button>
    </div>
  </div>
  <div class="composer">
    <input id="msg" type="text" placeholder="Type your message" autocomplete="off"
      onkeydown="if(event.key==='Enter')send()">
    <button id="sendbtn" onclick="send()" title="Send">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
</div>
<script>
const stream = document.getElementById('stream');
const input = document.getElementById('msg');
const EXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
  +'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'
  +'<path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function renderMarkdown(md, refs, pdf){
  const byN = {}; (refs||[]).forEach(r=>byN[r.n]=r);
  const inline = t => esc(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\[(\d+)\]/g,(m,n)=>{
      const r = byN[n]; const href = r ? (pdf+'#page='+r.pdf_page) : '#';
      return '<a class="cite" href="'+href+'" target="_blank" rel="noopener">['+n+']'+EXT+'</a>';
    });
  let html='', list=null; const close=()=>{if(list){html+='</'+list+'>';list=null;}};
  for(const raw of md.split('\n')){
    const line = raw.trim(); if(!line) continue; let m;
    if((m=line.match(/^\d+[.)]\s+(.*)/))){ if(list!=='ol'){close();html+='<ol>';list='ol';} html+='<li>'+inline(m[1])+'</li>'; }
    else if((m=line.match(/^[-*\u2022]\s+(.*)/))){ if(list!=='ul'){close();html+='<ul>';list='ul';} html+='<li>'+inline(m[1])+'</li>'; }
    else { close(); html+='<p>'+inline(line)+'</p>'; }
  }
  close(); return html;
}

function refsHtml(refs, pdf){
  if(!refs || !refs.length) return '';
  const items = refs.map(r =>
    '<div class="ref"><div class="num">'+r.n+'</div><div>'
    +'<a href="'+pdf+'#page='+r.pdf_page+'" target="_blank" rel="noopener">'+esc(r.title)+EXT+'</a>'
    +'<div class="pg">page '+esc(r.page)+'</div></div></div>').join('');
  return '<button class="refs-toggle" onclick="var d=this.nextElementSibling;'
    +'d.style.display=(d.style.display===\'none\'?\'flex\':\'none\')">'
    +refs.length+' reference'+(refs.length>1?'s':'')+' \u25be</button>'
    +'<div class="refs">'+items+'</div>';
}

function addUser(text){
  const row=document.createElement('div'); row.className='row user';
  row.innerHTML='<div class="bubble-user">'+esc(text)+'</div><div class="stamp">Just now</div>';
  stream.appendChild(row); stream.scrollTop=stream.scrollHeight;
}

async function ask(text){
  addUser(text);
  const row=document.createElement('div'); row.className='row';
  row.innerHTML='<div class="answer"><div class="srchdr">\u2611 Based on official sources</div>'
    +'<div class="body"><span class="typing"><span></span><span></span><span></span></span></div>'
    +'<div class="reffoot"></div></div>';
  stream.appendChild(row); stream.scrollTop=stream.scrollHeight;
  const body=row.querySelector('.body'), foot=row.querySelector('.reffoot');
  document.getElementById('sendbtn').disabled=true;
  try{
    const resp=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:text})});
    const reader=resp.body.getReader(); const dec=new TextDecoder();
    let buf='', meta=null, answer='';
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      const chunk=dec.decode(value,{stream:true});
      if(meta===null){
        buf+=chunk; const nl=buf.indexOf('\n');
        if(nl<0) continue;
        meta=JSON.parse(buf.slice(0,nl)); answer=buf.slice(nl+1);
        foot.innerHTML=refsHtml(meta.references, meta.pdf);
      }else{ answer+=chunk; }
      body.innerHTML=renderMarkdown(answer, meta.references, meta.pdf);
      stream.scrollTop=stream.scrollHeight;
    }
    if(meta===null && buf){ body.textContent=buf; }
  }catch(e){
    body.innerHTML='<p><strong>Something went wrong reaching the assistant.</strong> '
      +'Make sure the app window is still running.</p>';
  }finally{ document.getElementById('sendbtn').disabled=false; }
}

function send(){ const t=input.value.trim(); if(!t) return; input.value=''; ask(t); }

if(location.protocol==='file:'){
  document.querySelector('.greet').innerHTML='<h2>⚠️ Please start the app first</h2>'
    +'<p>You opened this file directly. Run <b>Start Companion</b> and use the page it '
    +'opens at <b>http://localhost:8000</b>.</p>';
  input.disabled=true; document.getElementById('sendbtn').disabled=true;
}
input.focus();
</script>
</body>
</html>
